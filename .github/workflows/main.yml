name: Main branch - pull request approved

on:
  pull_request:
    types: [closed]
    branches: [main]
env:
  PLUGIN_NAME: whmcs-bb-pix
  WORK_DIR: src
  COMPOSER_JSON_PATH: modules/gateways/lknbbpix
  PHP_VERSION: "8.1"

jobs:
  encode-build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Extrai a versão do constants.php do módulo automaticamente
      - name: Read module version
        id: module_version
        run: |
          VERSION=$(php -r "echo (require 'src/modules/gateways/lknbbpix/src/constants.php')['version'];")
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Move apenas os diretórios e arquivo necessários (mv seletivo — sem arquivos de dev)
      - name: Prepare release directory
        working-directory: ${{ env.WORK_DIR }}
        run: |
          mkdir "$PLUGIN_NAME"
          mv modules includes INSTALL.txt "$PLUGIN_NAME/"

      # Cache do Composer para acelerar builds consecutivos
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      # Roda composer install após mover os arquivos (vendor não entra no mv acima)
      - name: Composer install
        uses: php-actions/composer@v6
        with:
          php_version: ${{ env.PHP_VERSION }}
          working_dir: ${{ env.WORK_DIR }}/${{ env.PLUGIN_NAME }}/${{ env.COMPOSER_JSON_PATH }}
          args: --ignore-platform-reqs
          command: install
          dev: no

      # Compact plugin as .zip
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          path: ${{ env.PLUGIN_NAME }}
          directory: ${{ env.WORK_DIR }}
          filename: ${{ env.PLUGIN_NAME }}.zip

      # Update version tag
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.module_version.outputs.version }}

      # Generate new release
      - name: Generate new Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.WORK_DIR }}/${{ env.PLUGIN_NAME }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: "main"
          draft: false
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}